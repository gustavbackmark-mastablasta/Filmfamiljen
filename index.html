<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Filmfamiljen</title>
<style>
:root{--bg:#10151d;--panel:#1a222e;--panel2:#222d3b;--ink:#f4f2ed;--muted:#aeb8c5;--line:#354253;--accent:#f0b44c;--shadow:0 12px 32px rgba(0,0,0,.24)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(ellipse at top,#27394c 0,#121a25 48%,#0c1118 100%)}
.wrap{max-width:1240px;margin:auto;padding:34px 22px 70px}header{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:26px}
h1{font-family:Georgia,serif;font-size:clamp(36px,6vw,54px);margin:0;letter-spacing:-1px}.subtitle{color:var(--muted);font-size:14px;margin-top:8px}.pill{border:1px solid #526174;border-radius:99px;padding:7px 12px;color:#d7e0ea;font-size:12px}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:22px 0}button,input{font:inherit}
button{border:1px solid var(--line);border-radius:11px;padding:10px 14px;background:var(--panel2);color:var(--ink);cursor:pointer;transition:.15s}
button:hover:not(:disabled){transform:translateY(-1px);border-color:#71849b}button:disabled{opacity:.55;cursor:default}button.active,.primary{background:var(--accent);color:#171717;border-color:var(--accent);font-weight:750}
.memberbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:14px 0 18px}.member-label{width:100%;font-size:13px;color:var(--muted);margin-bottom:2px}.member-btn.active{background:#e8edf3;color:#18202a;border-color:#e8edf3;font-weight:750}
.legend{color:var(--muted);font-size:13px;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:18px}
.movie{overflow:hidden;background:rgba(26,34,46,.96);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);display:flex;flex-direction:column}
.poster{width:100%;aspect-ratio:2/3;object-fit:cover;background:#293544;display:block}.poster-placeholder{aspect-ratio:2/3;display:grid;place-items:center;color:#7f8da0;font-size:54px;background:linear-gradient(145deg,#293849,#18212c)}
.movie-body{padding:13px 14px 15px;display:flex;flex-direction:column;flex:1}.movie-title{font-family:Georgia,serif;font-size:19px;line-height:1.15;font-weight:700}.year{color:var(--muted);font-size:12px;margin-top:5px}
.rating{display:grid;grid-template-columns:repeat(5,20px) minmax(0,1fr);align-items:center;column-gap:4px;margin-top:13px;min-width:0}.star{display:block;width:20px;min-width:20px;border:0;background:none;padding:0;font-size:15px;line-height:1;filter:grayscale(1);opacity:.3;box-shadow:none}.star.on{filter:none;opacity:1}.star:hover:not(:disabled){transform:scale(1.08);border:0;background:none}.rating .avg{margin-left:0;justify-self:end;white-space:nowrap}
.mine{color:var(--muted);font-size:12px;margin-top:7px}.mine b{color:var(--ink)}.avg{margin-left:auto;font-weight:800;font-size:14px}.votes{color:var(--muted);font-weight:400;font-size:11px}
.bar{height:5px;background:#354253;border-radius:99px;overflow:hidden;margin-top:12px}.fill{height:100%;background:var(--accent);border-radius:99px}
.panel{background:rgba(26,34,46,.96);border:1px solid var(--line);border-radius:17px;padding:20px;box-shadow:var(--shadow);max-width:760px}.panel h2{font-family:Georgia,serif;margin:0 0 16px;font-size:27px}
.searchrow{display:flex;gap:9px}input{min-width:0;flex:1;border:1px solid #526174;border-radius:10px;background:#101720;color:var(--ink);padding:12px 13px}input::placeholder{color:#8290a1}
.results{display:grid;gap:10px;margin-top:16px}.result{display:flex;gap:13px;align-items:center;padding:9px;border:1px solid var(--line);border-radius:12px;background:#151e29}
.result img{width:58px;height:87px;object-fit:cover;border-radius:6px;background:#293544}.result-info{flex:1;min-width:0}.result-title{font-weight:750}.result-meta{font-size:12px;color:var(--muted);margin-top:4px}
.result-overview{font-size:12px;color:#c1cad5;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.result button{white-space:nowrap}
.status{color:var(--muted);font-size:13px;margin-top:12px;min-height:18px}.error{background:#512e31;border:1px solid #9b5659;color:#ffe3e2;padding:12px;border-radius:11px;margin:14px 0}
.table-wrap{overflow-x:auto;background:rgba(26,34,46,.96);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow)}table{border-collapse:collapse;width:100%;min-width:650px}
th,td{padding:12px 13px;border-bottom:1px solid var(--line);text-align:center}th{background:#263342;color:#e7edf4;font-size:13px}th:first-child,td:first-child{text-align:left}th button{padding:4px 6px;background:none;border:0;font-weight:750}
td:first-child{font-weight:650}tbody tr:last-child td{border-bottom:0}.rank{color:var(--muted);width:38px}.smallposter{width:34px;height:51px;object-fit:cover;border-radius:4px;vertical-align:middle;margin-right:9px}
.empty{padding:35px 15px;text-align:center;color:var(--muted);background:rgba(26,34,46,.8);border:1px dashed #526174;border-radius:15px}footer{margin-top:42px;color:#8290a1;font-size:11px;line-height:1.5}
@media(max-width:600px){.wrap{padding:24px 12px 50px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.movie-body{padding:10px}.movie-title{font-size:16px}.rating{grid-template-columns:repeat(5,18px) minmax(0,1fr);column-gap:3px}.star{width:18px;min-width:18px;font-size:13px}.searchrow{flex-direction:column}.result{align-items:flex-start}.result button{padding:8px}}
</style>
</head>
<body>
<div class="wrap">
<header><div><h1>🍿 Filmbombarna 💣💣💣</h1><div class="subtitle" id="subtitle">Laddar familjens filmer…</div></div><div class="pill">FEM TYCKARE · EN TOPPLISTA</div></header>
<div class="toolbar" id="tabs"></div><main id="content"><div class="empty">Hämtar filmer och betyg…</div></main>
<footer>Movie data and poster images provided by <a href="https://www.themoviedb.org/" target="_blank" rel="noopener" style="color:#e8b65c">TMDB</a>. This product uses the TMDB API but is not endorsed or certified by TMDB.</footer>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* Klistra in hela TMDB API Key (v3 auth) mellan citattecknen nedan. */
const SUPABASE_URL="https://iunoonvcydjjhpnqryrp.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_gLvrE3BmoYF4X-GadC7Otw_rMN7bnMn";
const TMDB_API_KEY="830e43428897a04978e6caf44fbf85ae";
const TMDB_IMAGE_BASE="https://image.tmdb.org/t/p/w500";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
// Sätt familjens PIN-koder här. Byt platshållarna mot egna fyrsiffriga koder.
const MEMBER_PINS={
  "Gustav":"4444",
  "Therese":"0242",
  "Knut":"2011",
  "Bo":"6666",
  "Bertil":"0808"
};
let members=[],films=[],ratings=[];
let selected=localStorage.getItem("filmfamiljenLoggedIn")||sessionStorage.getItem("filmfamiljenLoggedIn")||null;
let tab="rate",sortKey="avg",sortDirection="desc";
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function getRating(fid,mid){const r=ratings.find(x=>Number(x.film_id)===Number(fid)&&Number(x.member_id)===Number(mid));return r?Number(r.rating):null;}
function filmRatings(fid){return members.map(m=>getRating(fid,m.id));}
function average(a){const v=a.filter(x=>x!==null);return v.length?v.reduce((x,y)=>x+y,0)/v.length:0;}
function posterUrl(p){return p?TMDB_IMAGE_BASE+p:"";}
function renderTabs(){document.getElementById("tabs").innerHTML=`<button class="${tab==="rate"?"active":""}" onclick="tab='rate';render()">⭐ Sätt betyg</button><button class="${tab==="ranking"?"active":""}" onclick="tab='ranking';render()">🏆 Familjens topplista</button><button class="${tab==="add"?"active":""}" onclick="tab='add';render()">➕ Lägg till film</button>`;}
function renderMembers(){const e=document.getElementById("members");if(!e)return;e.innerHTML=`<div class="member-label">Inloggad som <b>${esc(selected)}</b> · <button onclick="logout()" style="padding:4px 8px">Byt person / logga ut</button></div>`;}
function showLogin(message=""){document.getElementById("tabs").innerHTML="";document.getElementById("content").innerHTML=`<section class="panel"><h2>Vem är du?</h2><div class="legend">Välj ditt namn och ange din personliga PIN-kod. Denna bestäms i samråd med patriarken</div><div class="searchrow" style="flex-wrap:wrap"><select id="loginName" style="flex:1;min-width:150px;padding:12px;border-radius:10px;background:#101720;color:var(--ink);border:1px solid #526174">${members.map(m=>`<option value="${esc(m.name)}">${esc(m.name)}</option>`).join("")}</select><input id="loginPin" type="password" inputmode="numeric" maxlength="4" placeholder="Fyrsiffrig PIN" style="flex:1;min-width:130px" onkeydown="if(event.key==='Enter')login()"></div><label style="display:flex;gap:8px;align-items:center;margin-top:14px;color:var(--muted);font-size:13px"><input id="rememberLogin" type="checkbox" style="flex:0;width:auto"> Kom ihåg mig på den här mobilen</label><button class="primary" style="margin-top:14px" onclick="login()">Logga in</button><div class="status" id="loginStatus">${esc(message)}</div></section>`;}
function login(){const name=document.getElementById("loginName").value,pin=document.getElementById("loginPin").value,remember=document.getElementById("rememberLogin").checked;if(MEMBER_PINS[name]!==pin){document.getElementById("loginStatus").textContent="Fel PIN-kod. Försök igen.";return;}selected=name;sessionStorage.setItem("filmfamiljenLoggedIn",name);if(remember)localStorage.setItem("filmfamiljenLoggedIn",name);else localStorage.removeItem("filmfamiljenLoggedIn");tab="rate";render();}
function logout(){localStorage.removeItem("filmfamiljenLoggedIn");sessionStorage.removeItem("filmfamiljenLoggedIn");selected=null;showLogin();}
function movieCard(f,member){const vals=filmRatings(f.id),mine=getRating(f.id,member.id),a=average(vals),valid=vals.filter(v=>v!==null),p=posterUrl(f.poster_path);return `<article class="movie">${p?`<img class="poster" src="${esc(p)}" alt="Filmaffisch för ${esc(f.title)}" loading="lazy">`:`<div class="poster-placeholder">🎬</div>`}<div class="movie-body"><div class="movie-title">${esc(f.title)}</div><div class="year">${f.release_year||"Årtal saknas"}</div><div class="rating">${[1,2,3,4,5].map(n=>`<button class="star ${mine>=n?"on":""}" aria-label="${n} av 5" onclick="rate(${f.id},${n})">💣</button>`).join("")}<div class="avg">${a?a.toFixed(1):"—"} <span class="votes">(${valid.length})</span></div></div><div class="mine">Ditt betyg: <b>${mine===null?"inte satt":mine+" / 5"}</b></div><div class="bar"><div class="fill" style="width:${a*20}%"></div></div></div></article>`;}
function renderRate(){const m=members.find(x=>x.name===selected)||members[0];if(!m){document.getElementById("content").innerHTML='<div class="empty">Inga familjemedlemmar hittades.</div>';return;}const ordered=[...films].sort((a,b)=>{const x=getRating(a.id,m.id),y=getRating(b.id,m.id);if(x===null&&y!==null)return 1;if(y===null&&x!==null)return -1;if(x!==null&&y!==null&&x!==y)return y-x;return Number(a.id)-Number(b.id);});document.getElementById("content").innerHTML=`<div class="memberbar" id="members"></div><div class="legend">Välj person och sätt betyg med bomberna. Dina högst betygsatta filmer hamnar överst.</div>${ordered.length?`<div class="grid">${ordered.map(f=>movieCard(f,m)).join("")}</div>`:'<div class="empty">Inga filmer ännu. Lägg till den första filmen!</div>'}`;renderMembers();}
function sortRanking(k){if(sortKey===k)sortDirection=sortDirection==="desc"?"asc":"desc";else{sortKey=k;sortDirection="desc";}renderRanking();}
function sortArrow(k){return sortKey===k?(sortDirection==="desc"?" ↓":" ↑"):"";}
function renderRanking(){const rows=films.map(f=>({film:f,values:filmRatings(f.id),avg:average(filmRatings(f.id))}));rows.sort((a,b)=>{const i=sortKey==="avg"?-1:members.findIndex(m=>String(m.id)===String(sortKey));const x=i<0?a.avg:(a.values[i]??-1),y=i<0?b.avg:(b.values[i]??-1);if(x===-1&&y!==-1)return 1;if(y===-1&&x!==-1)return -1;if(x===y)return Number(a.film.id)-Number(b.film.id);return sortDirection==="desc"?y-x:x-y;});document.getElementById("content").innerHTML=rows.length?`<div class="legend">Klicka på ett namn eller Snitt för att sortera. Filmer utan betyg hamnar sist.</div><div class="table-wrap"><table><thead><tr><th>#</th><th>Film</th><th><button onclick="sortRanking('avg')">Snitt${sortArrow("avg")}</button></th>${members.map(m=>`<th><button onclick="sortRanking('${m.id}')">${esc(m.name)}${sortArrow(String(m.id))}</button></th>`).join("")}</tr></thead><tbody>${rows.map((r,i)=>`<tr><td class="rank">${i+1}</td><td style="text-align:left">${r.film.poster_path?`<img class="smallposter" src="${esc(posterUrl(r.film.poster_path))}" alt="">`:""}${esc(r.film.title)} <span style="color:var(--muted);font-size:12px">${r.film.release_year||""}</span></td><td><b>${r.avg?r.avg.toFixed(1):"–"}</b></td>${r.values.map(v=>`<td>${v===null?"–":v}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`:'<div class="empty">Topplistan fylls på när ni lägger till filmer.</div>';}
function renderAdd(){document.getElementById("content").innerHTML=`<section class="panel"><h2>Hitta en film</h2><div class="searchrow"><input id="movieSearch" type="search" placeholder="Sök filmtitel, t.ex. The Matrix" onkeydown="if(event.key==='Enter')searchMovies()"><button class="primary" id="searchButton" onclick="searchMovies()">Sök filmer</button></div><div class="status" id="searchStatus">Sök i TMDB och välj rätt film bland träffarna.</div><div class="results" id="searchResults"></div></section>`;}
async function searchMovies(){const input=document.getElementById("movieSearch"),status=document.getElementById("searchStatus"),results=document.getElementById("searchResults"),q=input.value.trim();if(!q){status.textContent="Skriv en filmtitel först.";input.focus();return;}if(!TMDB_API_KEY||TMDB_API_KEY.includes("KLISTRA_IN")){status.textContent="Lägg först in din TMDB API Key i inställningarna i koden.";return;}status.textContent="Söker i TMDB…";results.innerHTML="";const button=document.getElementById("searchButton");button.disabled=true;try{const url=`https://api.themoviedb.org/3/search/movie?api_key=${encodeURIComponent(TMDB_API_KEY)}&query=${encodeURIComponent(q)}&language=sv-SE&include_adult=false&page=1`;const response=await fetch(url);if(!response.ok)throw new Error(`TMDB svarade med ${response.status}. Kontrollera API-nyckeln.`);const data=await response.json(),hits=(data.results||[]).slice(0,8);status.textContent=hits.length?`${hits.length} träffar. Välj rätt film:`:"Inga filmer hittades. Prova en annan stavning eller originaltitel.";results.innerHTML=hits.map(movie=>{const year=movie.release_date?movie.release_date.slice(0,4):"",img=posterUrl(movie.poster_path);return `<div class="result">${img?`<img src="${esc(img)}" alt="" loading="lazy">`:`<div style="width:58px;height:87px;display:grid;place-items:center;background:#293544;border-radius:6px">🎬</div>`}<div class="result-info"><div class="result-title">${esc(movie.title)}</div><div class="result-meta">${esc(year)}${movie.original_title&&movie.original_title!==movie.title?" · "+esc(movie.original_title):""}</div><div class="result-overview">${esc(movie.overview||"Ingen beskrivning tillgänglig.")}</div></div><button onclick="addMovie(${Number(movie.id)})">Lägg till</button></div>`;}).join("");}catch(e){status.textContent=e.message;}finally{button.disabled=false;}}
async function addMovie(id){const status=document.getElementById("searchStatus");status.textContent="Hämtar filminformation…";try{const response=await fetch(`https://api.themoviedb.org/3/movie/${id}?api_key=${encodeURIComponent(TMDB_API_KEY)}&language=sv-SE`);if(!response.ok)throw new Error(`Kunde inte hämta filmen (${response.status}).`);const m=await response.json(),record={tmdb_id:m.id,title:m.title||m.original_title,original_title:m.original_title||null,release_year:m.release_date?Number(m.release_date.slice(0,4)):null,poster_path:m.poster_path||null,overview:m.overview||null};const {error}=await db.from("films").insert(record);if(error){if(error.code==="23505")throw new Error("Filmen finns redan i Filmfamiljen.");throw error;}await loadData();tab="rate";render();}catch(e){status.textContent=e.message;}}
async function rate(filmId,value){const m=members.find(x=>x.name===selected);if(!m)return;document.querySelectorAll(".star").forEach(b=>b.disabled=true);const {error}=await db.from("film_ratings").upsert({film_id:filmId,member_id:m.id,rating:value},{onConflict:"film_id,member_id"});if(error){showError("Kunde inte spara betyget: "+error.message);return;}await loadData();render();}
function showError(msg){document.getElementById("content").insertAdjacentHTML("afterbegin",`<div class="error">${esc(msg)}</div>`);}
async function loadData(){const [m,b,r]=await Promise.all([db.from("film_members").select("id,name").order("id"),db.from("films").select("id,tmdb_id,title,original_title,release_year,poster_path,overview").order("id"),db.from("film_ratings").select("id,film_id,member_id,rating")]);if(m.error)throw m.error;if(b.error)throw b.error;if(r.error)throw r.error;members=m.data||[];films=b.data||[];ratings=r.data||[];if(!members.some(m=>m.name===selected))selected=members[0]?.name||"Gustav";document.getElementById("subtitle").textContent=`${films.length} filmer · ${members.length} familjemedlemmar · betyg 1–5`;}
function render(){if(!selected||!members.some(m=>m.name===selected)){showLogin();return;}renderTabs();if(tab==="rate")renderRate();else if(tab==="ranking")renderRanking();else if(tab==="add")renderAdd();}
(async function init(){try{await loadData();render();}catch(e){document.getElementById("content").innerHTML=`<div class="error"><b>Kunde inte ansluta till Filmfamiljens databas.</b><br>${esc(e.message||e)}</div>`;}})();
</script>
</body>
</html>
