<script>
/* =========================

const SUPABASE_URL = "https://iunoonvcydjjhpnqryrp.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_gLvrE3BmoYF4X-GadC7Otw_rMN7bnMn";
const TMDB_API_KEY = "830e43428897a04978e6caf44fbf85ae";
const TMDB_IMAGE_BASE = "https://image.tmdb.org/t/p/w500";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

let members = [], films = [], ratings = [];
let selected = localStorage.getItem("filmfamiljenSelectedMember") || "Gustav";
let tab = "rate", sortKey = "avg", sortDirection = "desc";

function esc(value){
  return String(value ?? "").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}
function getRating(filmId,memberId){
  const found=ratings.find(r=>Number(r.film_id)===Number(filmId)&&Number(r.member_id)===Number(memberId));
  return found ? Number(found.rating) : null;
}
function filmRatings(filmId){return members.map(m=>getRating(filmId,m.id));}
function average(values){
  const valid=values.filter(v=>v!==null);
  return valid.length ? valid.reduce((a,b)=>a+b,0)/valid.length : 0;
}
function posterUrl(path){return path ? TMDB_IMAGE_BASE+path : "";}

  document.getElementById("tabs").innerHTML=`

  const host=document.getElementById("members");
  if(!host)return;

  `).join("");
}
function chooseMember(name){

function movieCard(film,index,member){
  const values=filmRatings(film.id),mine=getRating(film.id,member.id),avg=average(values);
  const valid=values.filter(v=>v!==null);
  const poster=posterUrl(film.poster_path);
  return `<article class="movie">
    ${poster?`<img class="poster" src="${esc(poster)}" alt="Filmaffisch för ${esc(film.title)}" loading="lazy">`:`<div class="poster-placeholder">🎬</div>`}
    <div class="movie-body">
      <div class="movie-title">${esc(film.title)}</div>
      <div class="year">${film.release_year||"Årtal saknas"}</div>
      <div class="rating">
        ${[1,2,3,4,5].map(n=>`<button class="star ${mine>=n?"on":""}" aria-label="${n} av 5" onclick="rate(${film.id},${n})">★</button>`).join("")}

      </div>
      <div class="mine">Ditt betyg: <b>${mine===null?"inte satt":mine+" / 5"}</b></div>
      <div class="bar"><div class="fill" style="width:${avg*20}%"></div></div>
    </div>
  </article>`;
}
function renderRate(){
  const member=members.find(m=>m.name===selected)||members[0];
  if(!member){document.getElementById("content").innerHTML='<div class="empty">Inga familjemedlemmar hittades.</div>';return;}
  const ordered=[...films].sort((a,b)=>{
    const av=getRating(a.id,member.id),bv=getRating(b.id,member.id);
    if(av===null&&bv!==null)return 1;if(bv===null&&av!==null)return -1;
    if(av!==null&&bv!==null&&av!==bv)return bv-av;
    return Number(a.id)-Number(b.id);
  });
  document.getElementById("content").innerHTML=`
    <div class="memberbar" id="members"></div>
    <div class="legend">Välj person och sätt betyg med stjärnorna. Dina högst betygsatta filmer hamnar överst.</div>
    ${ordered.length?`<div class="grid">${ordered.map((f,i)=>movieCard(f,i,member)).join("")}</div>`:'<div class="empty">Inga filmer ännu. Lägg till den första filmen!</div>'}`;
  renderMembers();
}
function sortRanking(key){
  if(sortKey===key)sortDirection=sortDirection==="desc"?"asc":"desc";
  else{sortKey=key;sortDirection="desc";}
  renderRanking();
}
function sortArrow(key){return sortKey===key?(sortDirection==="desc"?" ↓":" ↑"):"";}
function renderRanking(){
  const rows=films.map(f=>({film:f,values:filmRatings(f.id),avg:average(filmRatings(f.id))}));
  rows.sort((a,b)=>{
    const index=sortKey==="avg"?-1:members.findIndex(m=>String(m.id)===String(sortKey));
    const av=index<0?a.avg:(a.values[index]??-1),bv=index<0?b.avg:(b.values[index]??-1);
    if(av===-1&&bv!==-1)return 1;if(bv===-1&&av!==-1)return -1;
    if(av===bv)return Number(a.film.id)-Number(b.film.id);
    return sortDirection==="desc"?bv-av:av-bv;
  });
  document.getElementById("content").innerHTML=rows.length?`
    <div class="legend">Klicka på ett namn eller Snitt för att sortera. Filmer utan betyg hamnar sist.</div>
    <div class="table-wrap"><table>
      <thead><tr><th>#</th><th>Film</th>
      ${members.map(m=>`<th><button onclick="sortRanking('${m.id}')">${esc(m.name)}${sortArrow(String(m.id))}</button></th>`).join("")}
      <th><button onclick="sortRanking('avg')">Snitt${sortArrow("avg")}</button></th></tr></thead>
      <tbody>${rows.map((r,i)=>`<tr>
        <td class="rank">${i+1}</td>
        <td style="text-align:left">${r.film.poster_path?`<img class="smallposter" src="${esc(posterUrl(r.film.poster_path))}" alt="">`:""}${esc(r.film.title)} <span style="color:var(--muted);font-size:12px">${r.film.release_year||""}</span></td>
        ${r.values.map(v=>`<td>${v===null?"–":v}</td>`).join("")}

      </tr>`).join("")}</tbody>
    </table></div>`:'<div class="empty">Topplistan fylls på när ni lägger till filmer.</div>';
}
function renderAdd(){
  document.getElementById("content").innerHTML=`

        <button class="primary" id="searchButton" onclick="searchMovies()">Sök filmer</button>
      </div>
      <div class="status" id="searchStatus">Sök i TMDB och välj rätt film bland träffarna.</div>
      <div class="results" id="searchResults"></div>
    </section>`;

async function searchMovies(){
  const input=document.getElementById("movieSearch"),status=document.getElementById("searchStatus"),results=document.getElementById("searchResults");
  const query=input.value.trim();
  if(!query){status.textContent="Skriv en filmtitel först.";input.focus();return;}
  if(!TMDB_API_KEY||TMDB_API_KEY.includes("KLISTRA_IN")){status.textContent="Lägg först in din TMDB API Key i inställningarna högst upp i koden.";return;}
  status.textContent="Söker i TMDB…";results.innerHTML="";
  const button=document.getElementById("searchButton");button.disabled=true;
  try{
    const url=`https://api.themoviedb.org/3/search/movie?api_key=${encodeURIComponent(TMDB_API_KEY)}&query=${encodeURIComponent(query)}&language=sv-SE&include_adult=false&page=1`;
    const response=await fetch(url);
    if(!response.ok)throw new Error(`TMDB svarade med ${response.status}. Kontrollera API-nyckeln.`);
    const data=await response.json();
    const hits=(data.results||[]).slice(0,8);
    status.textContent=hits.length?`${hits.length} träffar. Välj rätt film:`:"Inga filmer hittades. Prova en annan stavning eller originaltitel.";
    results.innerHTML=hits.map(movie=>{
      const year=movie.release_date?movie.release_date.slice(0,4):"";
      const img=posterUrl(movie.poster_path);
      return `<div class="result">
        ${img?`<img src="${esc(img)}" alt="" loading="lazy">`:`<div style="width:58px;height:87px;display:grid;place-items:center;background:#293544;border-radius:6px">🎬</div>`}
        <div class="result-info">
          <div class="result-title">${esc(movie.title)}</div>
          <div class="result-meta">${esc(year)}${movie.original_title&&movie.original_title!==movie.title?" · "+esc(movie.original_title):""}</div>
          <div class="result-overview">${esc(movie.overview||"Ingen beskrivning tillgänglig.")}</div>
        </div>
        <button onclick="addMovie(${Number(movie.id)})">Lägg till</button>
      </div>`;
    }).join("");
  }catch(error){status.textContent=error.message;}
  finally{button.disabled=false;}
}
async function addMovie(tmdbId){
  const status=document.getElementById("searchStatus");
  status.textContent="Hämtar filminformation…";
  try{
    const url=`https://api.themoviedb.org/3/movie/${tmdbId}?api_key=${encodeURIComponent(TMDB_API_KEY)}&language=sv-SE`;
    const response=await fetch(url);
    if(!response.ok)throw new Error(`Kunde inte hämta filmen (${response.status}).`);
    const movie=await response.json();
    const record={
      tmdb_id:movie.id,title:movie.title||movie.original_title,
      original_title:movie.original_title||null,
      release_year:movie.release_date?Number(movie.release_date.slice(0,4)):null,
      poster_path:movie.poster_path||null,overview:movie.overview||null
    };
    const {error}=await db.from("films").insert(record);
    if(error){
      if(error.code==="23505")throw new Error("Filmen finns redan i Filmfamiljen.");
      throw error;
    }
    await loadData();tab="rate";render();
  }catch(error){status.textContent=error.message;}
}
async function rate(filmId,value){
  const member=members.find(m=>m.name===selected);
  if(!member)return;
  document.querySelectorAll(".star").forEach(b=>b.disabled=true);
  const {error}=await db.from("film_ratings").upsert(
    {film_id:filmId,member_id:member.id,rating:value},
    {onConflict:"film_id,member_id"}
  );
  if(error){showError("Kunde inte spara betyget: "+error.message);return;}
  await loadData();render();
}
function showError(message){
  const content=document.getElementById("content");
  content.insertAdjacentHTML("afterbegin",`<div class="error">${esc(message)}</div>`);
}
async function loadData(){
  const [m,b,r]=await Promise.all([
    db.from("film_members").select("id,name").order("id"),
    db.from("films").select("id,tmdb_id,title,original_title,release_year,poster_path,overview").order("id"),
    db.from("film_ratings").select("id,film_id,member_id,rating")
  ]);
  if(m.error)throw m.error;if(b.error)throw b.error;if(r.error)throw r.error;
  members=m.data||[];films=b.data||[];ratings=r.data||[];
  if(!members.some(m=>m.name===selected))selected=members[0]?.name||"Gustav";
  document.getElementById("subtitle").textContent=`${films.length} filmer · ${members.length} familjemedlemmar · betyg 1–5`;
}
function render(){
  renderTabs();
  if(tab==="rate")renderRate();
  else if(tab==="ranking")renderRanking();
  else if(tab==="add")renderAdd();
}
(async function init(){
  try{await loadData();render();}
  catch(error){
    document.getElementById("content").innerHTML=`<div class="error"><b>Kunde inte ansluta till Filmfamiljens databas.</b><br>${esc(error.message||error)}</div>`;
  }
})();
